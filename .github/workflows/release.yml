name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            index($0, "## " ver) == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGES.md | sed 's/[[:space:]]*$//' > release-notes.txt

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.txt
        env:
          GH_TOKEN: ${{ github.token }}
