name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Drift guard: COVERAGE.md is generated from src/client.ts. If a
      # new endpoint lands without re-running `npm run gen-coverage`,
      # this job fails with a diff so the PR author re-runs it locally.
      - run: npm run check-coverage

      # Catch publishability regressions early — `npm pack --dry-run` is
      # what npm publish runs internally, so packaging issues (missing
      # files, .npmignore mistakes, exports-map mismatches) show up here
      # instead of at release time.
      - run: npm pack --dry-run
